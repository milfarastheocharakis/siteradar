name: Refresh business data

# Builds data/ (the businesses and municipality boundaries of Crete) from OpenStreetMap and Overture Maps,
# so the app can search there without waiting on the busy public map-data servers.
on:
  schedule:
    - cron: '23 4 * * 1'   # every Monday, 04:23 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/**', '.github/workflows/data.yml', 'index.html']   # the build reads the app's lists from index.html

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install osmium and pyarrow
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          python3 -m pip install --quiet pyarrow==26.0.1

      - name: Download Greece from Geofabrik
        run: |
          curl -fsSL --retry 5 --retry-delay 30 -o greece.osm.pbf https://download.geofabrik.de/europe/greece-latest.osm.pbf
          ls -lh greece.osm.pbf

      - name: Keep Crete's businesses and municipality boundaries
        run: |
          osmium extract -b 23.45,34.75,26.35,35.75 -s smart greece.osm.pbf -o crete.osm.pbf --overwrite
          osmium tags-filter crete.osm.pbf nwr/shop nwr/amenity nwr/tourism nwr/office nwr/craft nwr/healthcare nwr/leisure r/boundary=administrative -o picked.osm.pbf --overwrite
          osmium export picked.osm.pbf -f geojsonseq -u type_id -a type,id -o picked.geojsonseq --overwrite
          ls -lh crete.osm.pbf picked.osm.pbf picked.geojsonseq
          echo "OSM_DATE=$(osmium fileinfo -g header.option.osmosis_replication_timestamp greece.osm.pbf)" >> "$GITHUB_ENV"

      - name: Download Overture Maps places for Crete
        run: |
          set -o pipefail
          python3 tools/fetch_overture.py 23.45,34.75,26.35,35.75 overture.parquet | tee overture.log
          echo "OVERTURE_RELEASE=$(tail -n 1 overture.log)" >> "$GITHUB_ENV"

      - name: Write the data files
        run: |
          python3 tools/build_data.py picked.geojsonseq index.html data "$OSM_DATE" overture.parquet "$OVERTURE_RELEASE"
          du -sh data && ls data/cells | wc -l

      - name: Publish if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -q -m "Refresh business data (OpenStreetMap $OSM_DATE, Overture Maps $OVERTURE_RELEASE)"
          for i in 1 2 3; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then break; fi
            sleep 10
          done
          gh api -X POST "repos/${{ github.repository }}/pages/builds" > /dev/null || echo 'Pages build request failed; the push may start one by itself'
